version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bot_network

  bot:
    build: .
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - bot_network

volumes:
  pgdata:

networks:
  bot_network:
    driver: bridge